name: build

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "Dockerfile"
      - "deploy/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Nur Tags + die drei dynamischen OCI-Labels — die statischen Labels
      # (title, description, authors, CV) bleiben Sache des Dockerfiles.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Housekeeping: alte, nur mit Commit-SHA getaggte GHCR-Versionen weg ──
      # Multi-Arch-sicher — Details in .github/scripts/prune-ghcr.sh.
      # Ohne Secret GHCR_CLEANUP_TOKEN überspringt sich der Schritt selbst.
      - name: Prune alte GHCR-Versionen
        if: github.ref == 'refs/heads/main'
        env:
          OWNER: ${{ github.repository_owner }}
          PKG: curriculum-vitae
          KEEP: '10'
          GH_TOKEN: ${{ secrets.GHCR_CLEANUP_TOKEN }}
        run: bash .github/scripts/prune-ghcr.sh
